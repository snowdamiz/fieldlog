dependencies:
  - name: Official Swift compiler and standard library
    origin: https://www.swift.org/
    version: Apple Swift 6.4 swiftlang-6.4.0.34.1
    license: Apache-2.0 with Runtime Library Exception
    purpose: Original Swift models, storage, app compilation and tests
    distribution_mode: Platform toolchain and standard runtime
    owner: FieldLog native baseline
  - name: Apple platform SDKs
    origin: https://developer.apple.com/
    version: Xcode 27.1 build 27A9275; iPhoneSimulator 27.1
    license: Apple SDK agreement
    purpose: Foundation, SwiftUI, UIKit, PhotosUI, CoreTransferable, ImageIO, native sharing
    distribution_mode: System platform frameworks; no SDK redistribution
    owner: FieldLog native baseline
external_packages:
  - name: MixerCore
    origin: https://github.com/snowdamiz/mixer.git
    revision: d8c6965a277ca21e685f3ef9e0f68a7d59b46156
    purpose: Native task editor state, owned asynchronous save effects and lifecycle
    distribution_mode: Immutable public Git source dependency, exact revision in both package locks
    ownership: First-party independently authored Mixer code; no third-party engine
    qualification: Development API only; initial host and simulator consumer evidence, full dogfood gates open
provenance: Original app and tests independently authored; no competitor implementation or fixtures used.
