dependencies:
  - name: Official Swift compiler and standard library
    origin: https://www.swift.org/
    version: Apple Swift 6.4 swiftlang-6.4.0.34.1
    license: Apache-2.0 with Runtime Library Exception
    purpose: Original Swift models, storage, app compilation and tests
    distribution_mode: Platform toolchain and standard runtime
    owner: FieldLog native baseline
  - name: Apple platform SDKs
    origin: https://developer.apple.com/
    version: Xcode 27.1 build 27A9275; iPhoneSimulator 27.1
    license: Apple SDK agreement
    purpose: Foundation, SwiftUI, UIKit, PhotosUI, CoreTransferable, ImageIO, native sharing
    distribution_mode: System platform frameworks; no SDK redistribution
    owner: FieldLog native baseline
  - name: Python 3 standard library
    origin: https://www.python.org/
    version: Remote runner provisioned Python 3; actual sys.version recorded in each CI receipt
    license: Python Software Foundation License
    purpose: Bounded host CI collection, exact owned-child cleanup and source/pin evidence
    distribution_mode: CI platform tool; no Python packages or runtime redistributed with the app
    owner: FieldLog host development CI
  - name: Git
    origin: https://git-scm.com/
    version: Remote runner provisioned Git; actual git --version recorded in each CI receipt
    license: GPL-2.0
    purpose: Exact public-commit depth-one mirror and app/dependency source identity
    distribution_mode: CI platform tool; no Git binary redistributed with the app
    owner: FieldLog host development CI
  - name: GitHub Actions checkout and artifact upload
    origin: https://github.com/actions
    version: checkout 11d5960a326750d5838078e36cf38b85af677262; upload-artifact ea165f8d65b6e75b540449e92b4886f43607fa02
    license: MIT
    purpose: Separate app checkout and bounded development-evidence retention
    distribution_mode: Hosted CI actions; no action runtime redistributed with the app
    owner: FieldLog host development CI
external_packages:
  - name: MixerCore, MixerUI and MixerApple
    origin: https://github.com/snowdamiz/mixer.git
    revision: 56ff14c925168284761c5aca4f0bd4129cf3c995
    purpose: Shared task editor state, asynchronous save ownership, validated form document, event routing, navigation values and partial public native fields rendering
    distribution_mode: Immutable public Git source dependency, exact revision in both package locks
    ownership: First-party independently authored Mixer code; no third-party engine
    qualification: Development API only; snowdamiz/fieldlog is public under explicit user instruction; public baseline commit 4062256839c192645a9ba271d4244f482f9aa811 run 40762789024 compiled and executed 26 host tests with 25 passing and one whitespace-expectation failure, leaving consumed-SDK and post-test lock/source checks unreached; this slice corrects the test expectation and adds 12 Apple fields bridge tests, with all 38 integrated tests pending exact-commit host CI; historical private run 40744921829 had a billing/spending rejection before runner assignment (0 of 26 executed, no artifacts); earlier local Swift fetch cleanup remains unverified; native builds/rendering and immutable release-package, D0-D8 and GA qualification remain pending
provenance: Original app and tests independently authored; no competitor implementation or fixtures used.
